<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Matatena | Tradiciones al Aire</title>

    <link rel="stylesheet" href="estilos/matatena.css">
</head>

<body>

<div class="app">

    <!-- DECORACIÓN -->
    <div class="decoracion decoracion-1">✦</div>
    <div class="decoracion decoracion-2">✧</div>
    <div class="decoracion decoracion-3">✣</div>


    <!-- ENCABEZADO -->
    <header class="matatena-header">

        <a href="index.html" class="volver">
            ← Inicio
        </a>

        <button
            class="boton-sonido"
            id="botonSonido"
            aria-label="Activar o desactivar sonido">
            🔊
        </button>

        <div class="etiqueta-juego">
            ✣ JUEGO TRADICIONAL
        </div>

        <h1>La Matatena</h1>

        <p class="frase">
            Lanza la pelota,<br>
            ¡y atrapa las piezas!
        </p>

    </header>


    <!-- JUEGO -->
    <section class="matatena-hero">

        <div class="brillo"></div>

        <div class="escena-juego" id="escenaJuego">

            <!-- PELOTA -->
            <div
                class="pelota"
                id="pelota">
            </div>

            <!-- PIEZAS -->
            <div class="piezas" id="piezas">

                <div class="pieza pieza-1">
                    <svg viewBox="0 0 40 40" width="36" height="36">
                        <path d="M20 4V36M4 20H36M9 9L31 31M31 9L9 31"
                            stroke="#fff"
                            stroke-width="5"
                            stroke-linecap="round"/>
                        <g fill="#fff">
                            <circle cx="20" cy="4" r="4"/>
                            <circle cx="20" cy="36" r="4"/>
                            <circle cx="4" cy="20" r="4"/>
                            <circle cx="36" cy="20" r="4"/>
                            <circle cx="9" cy="9" r="3.5"/>
                            <circle cx="31" cy="31" r="3.5"/>
                            <circle cx="31" cy="9" r="3.5"/>
                            <circle cx="9" cy="31" r="3.5"/>
                        </g>
                    </svg>
                </div>

                <div class="pieza pieza-2">
                    <svg viewBox="0 0 40 40" width="36" height="36">
                        <path d="M20 4V36M4 20H36M9 9L31 31M31 9L9 31"
                            stroke="#fff"
                            stroke-width="5"
                            stroke-linecap="round"/>
                        <g fill="#fff">
                            <circle cx="20" cy="4" r="4"/>
                            <circle cx="20" cy="36" r="4"/>
                            <circle cx="4" cy="20" r="4"/>
                            <circle cx="36" cy="20" r="4"/>
                            <circle cx="9" cy="9" r="3.5"/>
                            <circle cx="31" cy="31" r="3.5"/>
                            <circle cx="31" cy="9" r="3.5"/>
                            <circle cx="9" cy="31" r="3.5"/>
                        </g>
                    </svg>
                </div>

                <div class="pieza pieza-3">
                    <svg viewBox="0 0 40 40" width="36" height="36">
                        <path d="M20 4V36M4 20H36M9 9L31 31M31 9L9 31"
                            stroke="#fff"
                            stroke-width="5"
                            stroke-linecap="round"/>
                        <g fill="#fff">
                            <circle cx="20" cy="4" r="4"/>
                            <circle cx="20" cy="36" r="4"/>
                            <circle cx="4" cy="20" r="4"/>
                            <circle cx="36" cy="20" r="4"/>
                            <circle cx="9" cy="9" r="3.5"/>
                            <circle cx="31" cy="31" r="3.5"/>
                            <circle cx="31" cy="9" r="3.5"/>
                            <circle cx="9" cy="31" r="3.5"/>
                        </g>
                    </svg>
                </div>

                <div class="pieza pieza-4">
                    <svg viewBox="0 0 40 40" width="36" height="36">
                        <path d="M20 4V36M4 20H36M9 9L31 31M31 9L9 31"
                            stroke="#fff"
                            stroke-width="5"
                            stroke-linecap="round"/>
                        <g fill="#fff">
                            <circle cx="20" cy="4" r="4"/>
                            <circle cx="20" cy="36" r="4"/>
                            <circle cx="4" cy="20" r="4"/>
                            <circle cx="36" cy="20" r="4"/>
                            <circle cx="9" cy="9" r="3.5"/>
                            <circle cx="31" cy="31" r="3.5"/>
                            <circle cx="31" cy="9" r="3.5"/>
                            <circle cx="9" cy="31" r="3.5"/>
                        </g>
                    </svg>
                </div>

                <div class="pieza pieza-5">
                    <svg viewBox="0 0 40 40" width="36" height="36">
                        <path d="M20 4V36M4 20H36M9 9L31 31M31 9L9 31"
                            stroke="#fff"
                            stroke-width="5"
                            stroke-linecap="round"/>
                        <g fill="#fff">
                            <circle cx="20" cy="4" r="4"/>
                            <circle cx="20" cy="36" r="4"/>
                            <circle cx="4" cy="20" r="4"/>
                            <circle cx="36" cy="20" r="4"/>
                            <circle cx="9" cy="9" r="3.5"/>
                            <circle cx="31" cy="31" r="3.5"/>
                            <circle cx="31" cy="9" r="3.5"/>
                            <circle cx="9" cy="31" r="3.5"/>
                        </g>
                    </svg>
                </div>

            </div>

            <div class="sombra-juego"></div>

        </div>


        <p
            class="mensaje-juego"
            id="mensajeJuego">
            Presiona comenzar para jugar
        </p>


        <button
            class="boton-jugar"
            id="botonJugar">

            <span>🟡</span>
            ¡Lanzar pelota!

        </button>

    </section>


    <!-- MARCADOR -->
    <section class="marcador">

        <div class="marcador-item">

            <span class="marcador-icono">
                🎯
            </span>

            <small>PIEZAS</small>

            <strong id="piezasAtrapadas">
                0
            </strong>

        </div>


        <div class="marcador-item principal">

            <span class="marcador-icono">
                🏆
            </span>

            <small>RÉCORD</small>

            <strong id="record">
                0
            </strong>

        </div>


        <div class="marcador-item">

            <span class="marcador-icono">
                🔥
            </span>

            <small>RACHA</small>

            <strong id="racha">
                0
            </strong>

        </div>

    </section>

</div>


<script src="Java Script/matatena.js"></script>

</body>
</html>
